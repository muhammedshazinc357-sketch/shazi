<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101710">
  <title>Classic Snake — Shazin</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><span class="pixel">▦</span><div><small>CLASSIC ARCADE</small><h1>SNAKE<span>_</span></h1></div></div>
      <div class="status" id="status" aria-live="polite">READY TO PLAY</div>
    </header>

    <section class="game-panel" aria-label="Snake game">
      <div class="score-row">
        <div><span class="label">SCORE</span><strong id="score">000</strong></div>
        <div><span class="label">BEST</span><strong id="best">000</strong></div>
      </div>
      <div class="screen-wrap">
        <canvas id="board" width="400" height="400" aria-label="Snake game board"></canvas>
        <div class="overlay" id="overlay">
          <div class="overlay-card">
            <div class="mini-icon">▣</div>
            <h2 id="overlay-title">SNAKE GAME</h2>
            <p id="overlay-copy">Eat the food. Don't hit the walls or yourself.</p>
            <button id="start" class="primary">START GAME <span>▶</span></button>
          </div>
        </div>
      </div>
      <div class="controls">
        <button id="pause" class="secondary" disabled>PAUSE</button>
        <p>SWIPE OR USE ARROW KEYS</p>
        <button id="restart" class="secondary">RESTART</button>
      </div>
      <div class="dpad" aria-label="Touch controls">
        <button data-dir="up" aria-label="Move up">▲</button>
        <div><button data-dir="left" aria-label="Move left">◀</button><button data-dir="down" aria-label="Move down">▼</button><button data-dir="right" aria-label="Move right">▶</button></div>
      </div>
    </section>
    <footer><span>MADE BY MUHAMMED SHAZIN C</span><span>HTML · CSS · JAVASCRIPT</span></footer>
  </main>
</body>
</html>
